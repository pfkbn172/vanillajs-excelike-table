name: Release

# Pushing a tag vX.Y.Z creates the GitHub Release with the built files.
# Publishing to npm is done by hand (`npm publish`, which runs every test first).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check the tag matches package.json
        run: |
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      - name: Lint and unit tests
        run: |
          npm run lint
          npm test

      - name: Build project
        run: npm run build

      - name: Node import and type tests
        run: |
          npm run test:node
          npm run test:types

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/excelike-table.js
            dist/excelike-table.min.js
            dist/excelike-table.cjs
            dist/excelike-table.browser.js
            dist/excelike-table.bundle.min.js
            dist/excelike-table.css
            dist/excelike-table.min.css
            dist/excelike-table.d.ts
