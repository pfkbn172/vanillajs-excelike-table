<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>数値フィルター修正確認</title>
    <link rel="stylesheet" href="src/ExceLikeTable.css">
    <style>
        body { margin: 20px; font-family: Arial, sans-serif; }
        .test-info { background: #f0f8ff; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="test-info">
        <h2>数値フィルター修正確認テスト</h2>
        <p><strong>テスト手順:</strong></p>
        <ol>
            <li>給与列のフィルターを開く</li>
            <li>最小値（下限）のチェックを外す → スライダーが連動して動く</li>
            <li>最大値（上限）のチェックを外す → スライダーが連動して動く</li>
            <li>中間値のチェックを外す → スライダーは動かない</li>
            <li>一部チェックを外した状態で「すべて選択」が中間状態（□）になる</li>
        </ol>
    </div>
    
    <div id="table-container" style="height: 400px; border: 1px solid #ccc;"></div>

    <script src="src/ExceLikeTable.js"></script>
    <script>
        // 単純なテストデータ（数値が明確）
        const testData = [
            { id: 1, name: 'テスト1', salary: 50000 },
            { id: 2, name: 'テスト2', salary: 60000 },
            { id: 3, name: 'テスト3', salary: 70000 },
            { id: 4, name: 'テスト4', salary: 80000 },
            { id: 5, name: 'テスト5', salary: 90000 }
        ];

        const columns = [
            {
                key: 'id',
                title: 'ID',
                dataIndex: 'id',
                width: 80,
                sortable: true,
                filterable: true
            },
            {
                key: 'name',
                title: '名前',
                dataIndex: 'name',
                width: 120,
                sortable: true,
                filterable: true
            },
            {
                key: 'salary',
                title: '給与',
                dataIndex: 'salary',
                width: 120,
                sortable: true,
                filterable: true,
                render: (value) => `¥${value.toLocaleString()}`
            }
        ];

        try {
            const table = new ExceLikeTable('#table-container', {
                data: testData,
                columns: columns,
                rowKey: 'id',
                pagination: { pageSize: 10 },
                bordered: true
            });
            
            console.log('✅ テーブル初期化成功');
            console.log('📝 給与フィルターで以下をテスト:');
            console.log('1. 50000(最小)を外す → スライダー連動');
            console.log('2. 90000(最大)を外す → スライダー連動');
            console.log('3. 60000,70000,80000(中間)を外す → スライダー固定');
            console.log('4. 一部選択時の「すべて選択」中間状態確認');
            
        } catch (error) {
            console.error('❌ エラー:', error);
            document.body.innerHTML += '<div style="color: red; padding: 20px;">エラー: ' + error.message + '</div>';
        }
    </script>
</body>
</html>
