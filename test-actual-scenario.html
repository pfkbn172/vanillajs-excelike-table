<!DOCTYPE html>
<html>
<head>
    <title>Test Actual Filter Scenario</title>
    <link rel="stylesheet" href="src/ExceLikeTable.css">
</head>
<body>
    <h1>Test Actual Filter Save/Restore Scenario</h1>
    <div id="results"></div>
    <div id="table-container" style="height: 400px; border: 1px solid #ddd; margin: 20px 0;"></div>
    
    <script src="src/ExceLikeTable.js"></script>
    <script>
        // Generate sample data (same as index.html)
        function generateSampleData(count = 20) {
            const names = ['John Smith', 'Jane Doe', 'Bob Johnson', 'Alice Brown', 'Charlie Davis'];
            const departments = ['Engineering', 'Marketing', 'Sales', 'HR', 'Finance'];
            const locations = ['New York', 'San Francisco', 'London', 'Tokyo', 'Sydney'];
            const statuses = ['Active', 'Inactive', 'Pending', 'Suspended'];
            
            const data = [];
            for (let i = 1; i <= count; i++) {
                data.push({
                    id: i,
                    name: names[Math.floor(Math.random() * names.length)],
                    department: departments[Math.floor(Math.random() * departments.length)],
                    location: locations[Math.floor(Math.random() * locations.length)],
                    salary: Math.floor(Math.random() * 150000) + 50000,
                    experience: Math.floor(Math.random() * 20) + 1,
                    joinDate: new Date(2020 + Math.random() * 4, Math.random() * 12, Math.random() * 28).toISOString().split('T')[0],
                    status: statuses[Math.floor(Math.random() * statuses.length)],
                    performance: Math.floor(Math.random() * 100) + 1
                });
            }
            return data;
        }

        // Column definitions (same as index.html)
        const columns = [
            {
                key: 'id',
                title: 'ID',
                dataIndex: 'id',
                width: 80,
                sortable: true,
                filterable: true
            },
            {
                key: 'name',
                title: 'Name',
                dataIndex: 'name',
                width: 150,
                sortable: true,
                filterable: true
            },
            {
                key: 'salary',
                title: 'Salary',
                dataIndex: 'salary',
                width: 120,
                sortable: true,
                filterable: true,
                render: (value) => `$${value.toLocaleString()}`
            },
            {
                key: 'experience',
                title: 'Experience (Years)',
                dataIndex: 'experience',
                width: 140,
                sortable: true,
                filterable: true,
                render: (value) => `${value} years`
            }
        ];

        const sampleData = generateSampleData(20);
        console.log('Sample data:', sampleData.slice(0, 3));

        // Initialize table with debug logging
        const table = new ExceLikeTable('#table-container', {
            data: sampleData,
            columns: columns,
            rowKey: 'id',
            pagination: {
                pageSize: 10,
                showSizeChanger: true
            },
            bordered: true,
            size: 'middle',
            tableId: 'debug-test-table',
            persistSettings: true
        });

        // Log current state after initialization
        setTimeout(() => {
            console.log('\n=== INITIAL STATE ===');
            console.log('Current filters:', table.state.filters);
            console.log('Current range filters:', table.state.rangeFilters);
            
            // Get unique values for both columns
            const salaryValues = [...new Set(sampleData.map(item => item.salary))].sort((a,b) => a-b);
            const experienceValues = [...new Set(sampleData.map(item => item.experience))].sort((a,b) => a-b);
            
            console.log('\nSalary unique values (first 10):', salaryValues.slice(0, 10));
            console.log('Experience unique values:', experienceValues);
            
            // Check isNumericColumn for both
            const salaryColumn = columns.find(c => c.key === 'salary');
            const experienceColumn = columns.find(c => c.key === 'experience');
            
            console.log('\nColumn detection:');
            console.log('Salary isNumericColumn:', table.isNumericColumn(salaryColumn));
            console.log('Experience isNumericColumn:', table.isNumericColumn(experienceColumn));
            
            document.getElementById('results').innerHTML = `
                <h2>Debug Information</h2>
                <p><strong>Data count:</strong> ${sampleData.length}</p>
                <p><strong>Salary values:</strong> ${salaryValues.slice(0, 5).join(', ')}... (${salaryValues.length} unique)</p>
                <p><strong>Experience values:</strong> ${experienceValues.join(', ')} (${experienceValues.length} unique)</p>
                <p><strong>Salary isNumeric:</strong> ${table.isNumericColumn(salaryColumn)}</p>
                <p><strong>Experience isNumeric:</strong> ${table.isNumericColumn(experienceColumn)}</p>
                <hr>
                <p><strong>Instructions:</strong></p>
                <ol>
                    <li>Open Salary filter and select a few values, then click OK</li>
                    <li>Open Experience filter and select a few values, then click OK</li>
                    <li>Refresh the page to test restoration</li>
                    <li>Check browser console for detailed logs</li>
                </ol>
            `;
        }, 100);

        // Override the handleFilter method to add debug logging
        const originalHandleFilter = table.handleFilter.bind(table);
        table.handleFilter = function(columnKey, filters) {
            console.log(`\n=== FILTER UPDATE: ${columnKey} ===`);
            console.log('New filters:', filters);
            console.log('Filter types:', filters.map(f => typeof f));
            return originalHandleFilter(columnKey, filters);
        };

        // Override the saveSettings method to log what's being saved
        const originalSaveSettings = table.saveSettings.bind(table);
        table.saveSettings = function() {
            console.log('\n=== SAVING SETTINGS ===');
            console.log('Filters being saved:', this.state.filters);
            console.log('Range filters being saved:', this.state.rangeFilters);
            return originalSaveSettings();
        };
    </script>
</body>
</html>
