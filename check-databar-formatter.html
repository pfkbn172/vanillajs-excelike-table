<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>DataBarFormatter チェック</title>
</head>
<body>
    <h2>DataBarFormatter 読み込みチェック</h2>
    <div id="result"></div>
    
    <!-- 必要なスクリプトを読み込む -->
    <script src="src/plugins/conditional-formatting/config.js"></script>
    <script src="src/plugins/conditional-formatting/utils.js"></script>
    <script src="src/plugins/conditional-formatting/formatters/BaseFormatter.js"></script>
    <script src="src/plugins/conditional-formatting/formatters/DataBarFormatter.js"></script>
    
    <script>
        const result = document.getElementById('result');
        
        // チェック項目
        const checks = [
            {
                name: 'ConditionalFormattingConfig',
                obj: window.ConditionalFormattingConfig
            },
            {
                name: 'ConditionalFormattingUtils',
                obj: window.ConditionalFormattingUtils
            },
            {
                name: 'ConditionalFormattingBaseFormatter',
                obj: window.ConditionalFormattingBaseFormatter
            },
            {
                name: 'ConditionalFormattingDataBarFormatter',
                obj: window.ConditionalFormattingDataBarFormatter
            }
        ];
        
        let html = '<h3>チェック結果:</h3><ul>';
        
        checks.forEach(check => {
            const status = check.obj ? '✅ OK' : '❌ NG';
            const type = check.obj ? typeof check.obj : 'undefined';
            html += `<li><strong>${check.name}</strong>: ${status} (${type})</li>`;
        });
        
        html += '</ul>';
        
        // DataBarFormatterのインスタンス化テスト
        if (window.ConditionalFormattingDataBarFormatter) {
            try {
                const config = window.ConditionalFormattingConfig || {};
                const Utils = window.ConditionalFormattingUtils;
                const utils = new Utils(config);
                const formatter = new window.ConditionalFormattingDataBarFormatter(config, utils);
                
                html += '<h3>DataBarFormatterインスタンス化:</h3>';
                html += '<p>✅ 成功</p>';
                
                // メソッドチェック
                html += '<h3>メソッド確認:</h3><ul>';
                html += `<li>canHandle: ${typeof formatter.canHandle}</li>`;
                html += `<li>apply: ${typeof formatter.apply}</li>`;
                html += `<li>calculatePercentage: ${typeof formatter.calculatePercentage}</li>`;
                html += `<li>calculateZeroToMax: ${typeof formatter.calculateZeroToMax}</li>`;
                html += '</ul>';
                
            } catch (error) {
                html += '<h3>DataBarFormatterインスタンス化:</h3>';
                html += `<p>❌ エラー: ${error.message}</p>`;
            }
        }
        
        result.innerHTML = html;
    </script>
</body>
</html>
