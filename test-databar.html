<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>DataBar 0基準テスト</title>
    <style>
        table {
            border-collapse: collapse;
            margin: 20px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: right;
        }
        th {
            background-color: #f0f0f0;
        }
        .test-container {
            padding: 20px;
        }
        .test-bar {
            background: #4285f4;
            height: 20px;
            color: white;
            text-align: center;
            line-height: 20px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h2>DataBar計算方式のテスト</h2>
        
        <h3>テストデータ</h3>
        <table>
            <tr>
                <th>値</th>
                <th>minMax方式<br>(300万-1000万)</th>
                <th>0基準方式<br>(0-1000万)</th>
                <th>違い</th>
            </tr>
            <tr>
                <td>300万</td>
                <td>
                    <div style="background: #f0f0f0; width: 200px;">
                        <div class="test-bar" style="width: 0%;">0%</div>
                    </div>
                </td>
                <td>
                    <div style="background: #f0f0f0; width: 200px;">
                        <div class="test-bar" style="width: 30%;">30%</div>
                    </div>
                </td>
                <td>0% → 30%</td>
            </tr>
            <tr>
                <td>500万</td>
                <td>
                    <div style="background: #f0f0f0; width: 200px;">
                        <div class="test-bar" style="width: 28.6%;">28.6%</div>
                    </div>
                </td>
                <td>
                    <div style="background: #f0f0f0; width: 200px;">
                        <div class="test-bar" style="width: 50%;">50%</div>
                    </div>
                </td>
                <td>28.6% → 50%</td>
            </tr>
            <tr>
                <td>1000万</td>
                <td>
                    <div style="background: #f0f0f0; width: 200px;">
                        <div class="test-bar" style="width: 100%;">100%</div>
                    </div>
                </td>
                <td>
                    <div style="background: #f0f0f0; width: 200px;">
                        <div class="test-bar" style="width: 100%;">100%</div>
                    </div>
                </td>
                <td>100% → 100%</td>
            </tr>
        </table>

        <h3>計算式</h3>
        <ul>
            <li><strong>minMax方式:</strong> (値 - 最小値) / (最大値 - 最小値) × 100%</li>
            <li><strong>0基準方式:</strong> 値 / 最大値 × 100%</li>
        </ul>

        <h3>デバッグ用JavaScriptテスト</h3>
        <div id="debug-output"></div>
    </div>

    <script>
        // 数値パースのテスト
        function parseJapaneseNumber(value) {
            let cleaned = String(value || '').trim();
            
            // 万単位の処理
            const manMatch = cleaned.match(/(\d+(?:\.\d+)?)\s*万/);
            if (manMatch) {
                return parseFloat(manMatch[1]) * 10000;
            }
            
            // 通常の記号除去
            cleaned = cleaned.replace(/[¥,$円,]/g, '');
            return parseFloat(cleaned);
        }

        // 計算テスト
        const testData = ['300万', '500万', '1000万'];
        const output = document.getElementById('debug-output');
        
        output.innerHTML = '<h4>数値パーステスト結果:</h4><ul>';
        testData.forEach(value => {
            const parsed = parseJapaneseNumber(value);
            output.innerHTML += `<li>"${value}" → ${parsed.toLocaleString()}</li>`;
        });
        output.innerHTML += '</ul>';

        // 0基準計算テスト
        const max = parseJapaneseNumber('1000万');
        output.innerHTML += '<h4>0基準計算テスト:</h4><ul>';
        testData.forEach(value => {
            const parsed = parseJapaneseNumber(value);
            const percentage = (parsed / max) * 100;
            output.innerHTML += `<li>"${value}" → ${percentage.toFixed(1)}%</li>`;
        });
        output.innerHTML += '</ul>';
    </script>
</body>
</html>
