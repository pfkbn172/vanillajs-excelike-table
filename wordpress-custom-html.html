<!-- VanillaJS ExceLikeTable for WordPress Custom HTML - 全機能対応版 -->
<div id="excelike-table-container" style="height: 600px; margin: 20px 0;"></div>

<script src="https://unpkg.com/vanillajs-excelike-table@1.1.1/dist/excelike-table.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/vanillajs-excelike-table@1.1.1/dist/excelike-table.min.css">

<script>
document.addEventListener('DOMContentLoaded', function() {
  // サンプルデータ（21件）
  const sampleData = [
    { id: 1, name: '田中 太郎', department: '開発部', salary: 850000, joinDate: '2020-04-01', status: 'Active', email: 'tanaka@company.com' },
    { id: 2, name: '佐藤 花子', department: 'デザイン部', salary: 720000, joinDate: '2021-07-15', status: 'Active', email: 'sato@company.com' },
    { id: 3, name: '鈴木 次郎', department: '営業部', salary: 680000, joinDate: '2022-01-20', status: 'Pending', email: 'suzuki@company.com' },
    { id: 4, name: '高橋 美咲', department: '開発部', salary: 780000, joinDate: '2020-11-10', status: 'Active', email: 'takahashi@company.com' },
    { id: 5, name: '山田 一郎', department: 'マーケティング部', salary: 750000, joinDate: '2023-03-05', status: 'Active', email: 'yamada@company.com' },
    { id: 6, name: '渡辺 京子', department: 'デザイン部', salary: 690000, joinDate: '2021-12-01', status: 'Inactive', email: 'watanabe@company.com' },
    { id: 7, name: '伊藤 健太', department: '開発部', salary: 920000, joinDate: '2019-08-22', status: 'Active', email: 'ito@company.com' },
    { id: 8, name: '小林 愛美', department: '人事部', salary: 710000, joinDate: '2022-05-18', status: 'Active', email: 'kobayashi@company.com' },
    { id: 9, name: '加藤 雄二', department: '営業部', salary: 880000, joinDate: '2020-02-14', status: 'Active', email: 'kato@company.com' },
    { id: 10, name: '松本 さくら', department: 'マーケティング部', salary: 760000, joinDate: '2024-01-15', status: 'Pending', email: 'matsumoto@company.com' },
    { id: 11, name: '林 大輔', department: '開発部', salary: 830000, joinDate: '2021-09-30', status: 'Active', email: 'hayashi@company.com' },
    { id: 12, name: '木村 理恵', department: '人事部', salary: 740000, joinDate: '2020-06-12', status: 'Active', email: 'kimura@company.com' },
    { id: 13, name: '斎藤 雅之', department: '営業部', salary: 720000, joinDate: '2023-08-07', status: 'Active', email: 'saito@company.com' },
    { id: 14, name: '中村 奈美', department: 'デザイン部', salary: 700000, joinDate: '2022-11-25', status: 'Active', email: 'nakamura@company.com' },
    { id: 15, name: '原田 博文', department: 'マーケティング部', salary: 810000, joinDate: '2019-12-03', status: 'Active', email: 'harada@company.com' },
    { id: 16, name: '森 智子', department: '人事部', salary: 730000, joinDate: '2021-04-22', status: 'Inactive', email: 'mori@company.com' },
    { id: 17, name: '池田 康介', department: '開発部', salary: 890000, joinDate: '2020-10-15', status: 'Active', email: 'ikeda@company.com' },
    { id: 18, name: '清水 美香', department: 'デザイン部', salary: 680000, joinDate: '2023-02-28', status: 'Active', email: 'shimizu@company.com' },
    { id: 19, name: '橋本 拓也', department: '営業部', salary: 770000, joinDate: '2022-07-11', status: 'Active', email: 'hashimoto@company.com' },
    { id: 20, name: '藤田 由紀', department: 'マーケティング部', salary: 790000, joinDate: '2021-01-18', status: 'Active', email: 'fujita@company.com' },
    { id: 21, name: '大野 誠司', department: '開発部', salary: 950000, joinDate: '2018-05-14', status: 'Active', email: 'ono@company.com' }
  ];

  // 列定義 - ColumnHelpersを使用して全機能対応
  const columns = [
    // 数値列 - 自動フィルタリング機能付き
    ColumnHelpers.number('id', 'ID', { 
      width: 60,
      filterType: 'numeric',
      sortable: true,
      filterable: true
    }),
    
    // テキスト列 - 検索フィルタ機能付き
    ColumnHelpers.text('name', '氏名', { 
      width: 140,
      sortable: true,
      filterable: true
    }),
    
    // テキスト列（部署） - セレクトフィルタ機能付き
    ColumnHelpers.text('department', '部署', { 
      width: 140,
      sortable: true,
      filterable: true
    }),
    
    // 数値列（給与） - 範囲スライダー付きフィルタ
    ColumnHelpers.number('salary', '給与', { 
      width: 120,
      currency: '¥',
      sortable: true,
      filterable: true,
      filterType: 'numeric'
    }),
    
    // 日付列 - 階層フィルタ（年→月→日）+ 日付範囲スライダー
    ColumnHelpers.date('joinDate', '入社日', { 
      width: 120,
      sortable: true,
      filterable: true,
      filterType: 'date-hierarchy'
    }),
    
    // ステータス列 - 色付きステータス表示
    ColumnHelpers.status('status', 'ステータス', {
      'Active': '#52c41a',
      'Pending': '#faad14', 
      'Inactive': '#ff4d4f'
    }, { 
      width: 120,
      sortable: true,
      filterable: true
    }),
    
    // テキスト列（メール） - 検索フィルタ機能付き
    ColumnHelpers.text('email', 'メールアドレス', { 
      width: 200,
      sortable: true,
      filterable: true
    })
  ];

  // テーブル初期化 - 全機能有効化（Excelプリセット使用）
  try {
    const table = new ExceLikeTable('#excelike-table-container', {
      // Excelプリセット：全機能を有効化
      preset: 'excel',
      
      // データとテーブル設定
      data: sampleData,
      columns: columns,
      rowKey: 'id',
      
      // ページネーション設定
      pagination: {
        pageSize: 10,
        showSizeChanger: true,
        pageSizeOptions: [5, 10, 20, 50]
      },
      
      // 見た目設定
      bordered: true,
      size: 'middle',
      
      // テーブル固有ID（設定保存用）
      tableId: 'wordpress-employee-table',
      
      // 設定の永続化を有効
      persistSettings: true,
      
      // 全機能を明示的に有効化
      features: [
        'sorting',           // 並び替え
        'filtering',         // フィルタリング
        'pagination',        // ページネーション
        'columnSettings',    // 列設定
        'persistSettings',   // 設定保存
        'columnResizing',    // 列幅変更
        'columnPinning'      // 列の固定
      ]
    });
    
    console.log('✅ ExceLikeTable（全機能版）が正常に初期化されました');
    console.log('📋 有効な機能:');
    console.log('  ✓ 並び替え（クリックで昇順→降順→なし）');
    console.log('  ✓ フィルタリング（数値範囲、日付階層、テキスト検索）');
    console.log('  ✓ ページネーション（サイズ変更可能）');
    console.log('  ✓ 列設定（表示/非表示、幅調整、固定）');
    console.log('  ✓ 設定自動保存（LocalStorage）');
    console.log('  ✓ 列幅リサイズ（ドラッグ&ダブルクリック）');
    console.log('  ✓ 列の固定（ピン機能）');
    console.log('  ✓ メニュー（⚙️）から設定変更可能');
    console.log('  ✓ スマホ対応（タッチ操作）');
    
    // タッチ対応状況をチェック
    console.log('📱 ブラウザのタッチ対応状況:');
    console.log('  Touch Events:', 'ontouchstart' in window);
    console.log('  Pointer Events:', 'onpointerdown' in window);
    console.log('  User Agent:', navigator.userAgent);
    console.log('  Platform:', navigator.platform);
    
    // スマホ対応: イベント委譲でタッチイベントを追加
    setupEventDelegation();
    
    console.log('✅ Event delegation setup complete');
    
    function setupEventDelegation() {
      console.log('🎯 Setting up event delegation for sliders...');
      
      // デバッグ: 全てのタッチイベントを監視
      document.addEventListener('touchstart', function(e) {
        console.log('🔍 ANY touchstart detected on:', e.target.tagName, e.target.className, e.target);
      }, true);
      
      document.addEventListener('click', function(e) {
        console.log('🔍 ANY click detected on:', e.target.tagName, e.target.className);
        
        // フィルターボタンがクリックされた場合
        if (e.target.closest('.filter-btn')) {
          console.log('🔽 FILTER BUTTON CLICKED! Waiting for dropdown...');
          
          // より長い待機時間で確実にドロップダウンを検出
          setTimeout(() => {
            console.log('🔽 Starting dropdown search...');
            const dropdowns = document.querySelectorAll('.filter-dropdown');
            console.log('🔽 Found dropdowns:', dropdowns.length);
            
            dropdowns.forEach((dropdown, i) => {
              console.log(`🔽 Dropdown ${i} FULL HTML:`, dropdown.innerHTML);
              
              const sliders = dropdown.querySelectorAll('[class*="slider"]');
              const thumbs = dropdown.querySelectorAll('[class*="thumb"]');
              console.log(`🔽 Dropdown ${i}: ${sliders.length} sliders, ${thumbs.length} thumbs`);
              
              // より詳細な検索
              const rangeSliders = dropdown.querySelectorAll('.range-slider');
              const rangeThumbs = dropdown.querySelectorAll('.range-thumb');
              const dateSliders = dropdown.querySelectorAll('.date-range-slider');
              const dateThumbs = dropdown.querySelectorAll('.date-range-thumb');
              
              console.log(`🔽 Detailed count:`, {
                rangeSliders: rangeSliders.length,
                rangeThumbs: rangeThumbs.length,
                dateSliders: dateSliders.length,
                dateThumbs: dateThumbs.length
              });
              
              // 各つまみに手動でイベントを追加してテスト
              rangeThumbs.forEach((thumb, ti) => {
                console.log(`🎯 Adding manual events to range thumb ${ti}`);
                thumb.addEventListener('click', function() {
                  console.log('✅ Manual click event works on range thumb!', thumb);
                });
                thumb.addEventListener('touchstart', function(e) {
                  console.log('✅ Manual touchstart event works on range thumb!', thumb);
                  e.preventDefault();
                }, { passive: false });
              });
              
              dateThumbs.forEach((thumb, ti) => {
                console.log(`🎯 Adding manual events to date thumb ${ti}`);
                thumb.addEventListener('click', function() {
                  console.log('✅ Manual click event works on date thumb!', thumb);
                });
                thumb.addEventListener('touchstart', function(e) {
                  console.log('✅ Manual touchstart event works on date thumb!', thumb);
                  e.preventDefault();
                }, { passive: false });
              });
            });
            
            // もしドロップダウンが見つからない場合、全体を検索
            if (dropdowns.length === 0) {
              console.log('🔍 No dropdowns found, searching entire document...');
              const allElements = document.querySelectorAll('*');
              let foundSliders = 0;
              let foundThumbs = 0;
              
              allElements.forEach(el => {
                if (el.className && el.className.includes('slider')) {
                  foundSliders++;
                  console.log('🔍 Found slider element:', el.className, el);
                }
                if (el.className && el.className.includes('thumb')) {
                  foundThumbs++;
                  console.log('🔍 Found thumb element:', el.className, el);
                }
              });
              
              console.log(`🔍 Global search result: ${foundSliders} sliders, ${foundThumbs} thumbs`);
            }
            
          }, 500); // 長めの待機時間
        }
      }, true);
      
      // 10秒後にDOM構造をダンプ
      setTimeout(() => {
        console.log('🔍 DOM DUMP: Looking for filter elements...');
        
        // フィルタードロップダウンを探す
        const dropdowns = document.querySelectorAll('[class*="filter"], [class*="dropdown"]');
        console.log('🔍 Found filter/dropdown elements:', dropdowns.length);
        dropdowns.forEach((el, i) => {
          console.log(`  ${i}: ${el.tagName}.${el.className}`);
        });
        
        // スライダー関連要素を探す
        const sliders = document.querySelectorAll('[class*="slider"], [class*="range"]');
        console.log('🔍 Found slider/range elements:', sliders.length);
        sliders.forEach((el, i) => {
          console.log(`  ${i}: ${el.tagName}.${el.className}`);
        });
        
        // つまみ関連要素を探す
        const thumbs = document.querySelectorAll('[class*="thumb"], [class*="handle"]');
        console.log('🔍 Found thumb/handle elements:', thumbs.length);
        thumbs.forEach((el, i) => {
          console.log(`  ${i}: ${el.tagName}.${el.className}`);
        });
        
        // テーブルコンテナの中身をダンプ
        const tableContainer = document.getElementById('excelike-table-container');
        if (tableContainer) {
          console.log('🔍 Table container HTML (first 1000 chars):');
          console.log(tableContainer.innerHTML.substring(0, 1000));
        }
        
      }, 10000);
      
      // グローバル変数でドラッグ状態を管理
      let globalDragState = {
        isDragging: false,
        startX: 0,
        startLeft: 0,
        dragType: null,
        touchId: null,
        activeThumb: null,
        activeSlider: null
      };
      
      // ドキュメント全体でタッチスタートを監視（イベント委譲）
      document.addEventListener('touchstart', function(e) {
        console.log('🎯 TouchStart - checking for thumb...', e.target.className);
        
        const thumb = e.target.closest('.range-thumb, .date-range-thumb');
        console.log('🎯 Found thumb:', thumb);
        
        if (!thumb) {
          // より広い検索を試す
          const possibleThumb = e.target.closest('[class*="thumb"], [class*="handle"], [class*="slider"]');
          if (possibleThumb) {
            console.log('🔍 Found possible slider element:', possibleThumb.className, possibleThumb);
          }
          return;
        }
        
        console.log('👆 Event delegation: Touch start on thumb!', thumb.className);
        
        const slider = thumb.closest('.range-slider, .date-range-slider');
        if (!slider) {
          console.log('❌ No slider found for thumb');
          return;
        }
        
        console.log('👆 Found slider:', slider.className);
        
        e.preventDefault();
        
        if (globalDragState.isDragging) {
          console.log('⚠️ Already dragging, ignoring');
          return;
        }
        
        // ドラッグ開始
        globalDragState.isDragging = true;
        globalDragState.dragType = 'touch';
        globalDragState.activeThumb = thumb;
        globalDragState.activeSlider = slider;
        
        const touch = e.touches[0];
        globalDragState.touchId = touch.identifier;
        globalDragState.startX = touch.clientX;
        globalDragState.startLeft = parseFloat(thumb.style.left) || 0;
        
        thumb.style.zIndex = '1000';
        
        console.log('👆 Touch drag started:', {
          touchId: globalDragState.touchId,
          startX: globalDragState.startX,
          startLeft: globalDragState.startLeft
        });
        
      }, { passive: false });
      
      // マウスイベント用（開発者ツール対応）
      document.addEventListener('mousedown', function(e) {
        console.log('🖱️ MouseDown - checking for thumb...', e.target.className);
        
        const thumb = e.target.closest('.range-thumb, .date-range-thumb');
        console.log('🖱️ Found thumb:', thumb);
        
        if (!thumb) {
          // より広い検索を試す
          const possibleThumb = e.target.closest('[class*="thumb"], [class*="handle"], [class*="slider"]');
          if (possibleThumb) {
            console.log('🔍 Found possible slider element:', possibleThumb.className, possibleThumb);
          }
          return;
        }
        
        console.log('🖱️ Event delegation: Mouse down on thumb!', thumb.className);
        
        const slider = thumb.closest('.range-slider, .date-range-slider');
        if (!slider) {
          console.log('❌ No slider found for thumb');
          return;
        }
        
        e.preventDefault();
        
        if (globalDragState.isDragging) {
          console.log('⚠️ Already dragging, ignoring');
          return;
        }
        
        // ドラッグ開始
        globalDragState.isDragging = true;
        globalDragState.dragType = 'mouse';
        globalDragState.activeThumb = thumb;
        globalDragState.activeSlider = slider;
        globalDragState.startX = e.clientX;
        globalDragState.startLeft = parseFloat(thumb.style.left) || 0;
        
        thumb.style.zIndex = '1000';
        
        console.log('🖱️ Mouse drag started:', {
          startX: globalDragState.startX,
          startLeft: globalDragState.startLeft
        });
      });
      
      // タッチ移動
      document.addEventListener('touchmove', function(e) {
        if (!globalDragState.isDragging || globalDragState.dragType !== 'touch') return;
        
        // 対象のタッチを見つける
        let targetTouch = null;
        for (let i = 0; i < e.touches.length; i++) {
          if (e.touches[i].identifier === globalDragState.touchId) {
            targetTouch = e.touches[i];
            break;
          }
        }
        
        if (!targetTouch) {
          console.log('👉 Target touch not found');
          return;
        }
        
        e.preventDefault();
        handleSliderMove(targetTouch.clientX);
        
      }, { passive: false });
      
      // マウス移動
      document.addEventListener('mousemove', function(e) {
        if (!globalDragState.isDragging || globalDragState.dragType !== 'mouse') return;
        
        e.preventDefault();
        handleSliderMove(e.clientX);
      });
      
      // タッチ終了
      document.addEventListener('touchend', function(e) {
        if (!globalDragState.isDragging || globalDragState.dragType !== 'touch') return;
        
        // 対象のタッチが終了したかチェック
        let touchEnded = true;
        for (let i = 0; i < e.touches.length; i++) {
          if (e.touches[i].identifier === globalDragState.touchId) {
            touchEnded = false;
            break;
          }
        }
        
        if (touchEnded) {
          console.log('🔚 Touch drag ended');
          endDrag();
        }
      }, { passive: false });
      
      // マウス終了
      document.addEventListener('mouseup', function(e) {
        if (!globalDragState.isDragging || globalDragState.dragType !== 'mouse') return;
        
        console.log('🔚 Mouse drag ended');
        endDrag();
      });
      
      function handleSliderMove(clientX) {
        const { activeThumb, activeSlider, startX, startLeft } = globalDragState;
        
        const sliderRect = activeSlider.getBoundingClientRect();
        const deltaX = clientX - startX;
        const newLeft = startLeft + (deltaX / sliderRect.width) * 100;
        const clampedLeft = Math.max(0, Math.min(100, newLeft));
        
        activeThumb.style.left = clampedLeft + '%';
        
        console.log(`👉 ${globalDragState.dragType} move:`, {
          deltaX: deltaX.toFixed(2),
          clampedLeft: clampedLeft.toFixed(2)
        });
        
        // トラックとinput更新
        updateSliderTrack(activeSlider, activeThumb);
        updateInputFromThumb(activeThumb, activeSlider, clampedLeft);
      }
      
      function endDrag() {
        const { activeThumb } = globalDragState;
        
        if (activeThumb) {
          activeThumb.style.zIndex = '';
          
          // input changeイベント発火
          const input = getCorrespondingInput(activeThumb, globalDragState.activeSlider);
          if (input) {
            input.dispatchEvent(new Event('input', { bubbles: true }));
            input.dispatchEvent(new Event('change', { bubbles: true }));
          }
        }
        
        // ドラッグ状態をリセット
        globalDragState = {
          isDragging: false,
          startX: 0,
          startLeft: 0,
          dragType: null,
          touchId: null,
          activeThumb: null,
          activeSlider: null
        };
      }
      
      console.log('🎯 Event delegation listeners attached to document');
    }
    
    function addMobileSliderSupport() {
      console.log('🔧 Setting up mobile slider support...');
      
      // 既存のスライダーもチェック
      const existingDropdowns = document.querySelectorAll('.filter-dropdown');
      console.log('🔍 Found existing filter dropdowns:', existingDropdowns.length);
      existingDropdowns.forEach((dropdown, index) => {
        console.log(`🔍 Processing existing dropdown ${index}`);
        addTouchToSliders(dropdown);
      });
      
      // MutationObserverでフィルタードロップダウンの追加を監視
      const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          mutation.addedNodes.forEach(function(node) {
            if (node.nodeType === 1 && node.classList && node.classList.contains('filter-dropdown')) {
              console.log('🆕 New filter dropdown detected!');
              // スライダーにタッチイベントを追加
              addTouchToSliders(node);
            }
          });
        });
      });
      
      observer.observe(document.body, {
        childList: true,
        subtree: true
      });
      
      console.log('👀 MutationObserver setup complete');
    }
    
    function addTouchToSliders(container) {
      console.log('🔍 Looking for sliders in container:', container);
      console.log('🔍 Container HTML preview:', container.innerHTML.substring(0, 200) + '...');
      
      // 全体的なスライダー要素をデバッグ
      const allSliders = container.querySelectorAll('[class*="slider"]');
      console.log('🔍 All slider-related elements:', allSliders.length);
      allSliders.forEach((el, i) => {
        console.log(`  ${i}: ${el.className}`);
      });
      
      // つまみ要素をデバッグ
      const allThumbs = container.querySelectorAll('[class*="thumb"]');
      console.log('🔍 All thumb-related elements:', allThumbs.length);
      allThumbs.forEach((el, i) => {
        console.log(`  ${i}: ${el.className}`);
      });
      
      // 数値範囲スライダー
      const rangeSliders = container.querySelectorAll('.range-slider');
      console.log('📊 Found range sliders:', rangeSliders.length);
      rangeSliders.forEach((slider, index) => {
        console.log(`📊 Range slider ${index}:`, slider);
        const thumbs = slider.querySelectorAll('.range-thumb');
        console.log(`📊 Range slider ${index}: found ${thumbs.length} thumbs`);
        thumbs.forEach((thumb, thumbIndex) => {
          console.log(`📊 Adding touch events to range thumb ${thumbIndex}:`, thumb);
          addTouchEvents(thumb, slider);
          
          // テスト用のクリックイベントも追加
          thumb.addEventListener('click', function() {
            console.log('🖱️ Thumb clicked!', thumb);
          });
        });
      });
      
      // 日付範囲スライダー
      const dateSliders = container.querySelectorAll('.date-range-slider');
      console.log('📅 Found date sliders:', dateSliders.length);
      dateSliders.forEach((slider, index) => {
        console.log(`📅 Date slider ${index}:`, slider);
        const thumbs = slider.querySelectorAll('.date-range-thumb');
        console.log(`📅 Date slider ${index}: found ${thumbs.length} thumbs`);
        thumbs.forEach((thumb, thumbIndex) => {
          console.log(`📅 Adding touch events to date thumb ${thumbIndex}:`, thumb);
          addTouchEvents(thumb, slider);
          
          // テスト用のクリックイベントも追加
          thumb.addEventListener('click', function() {
            console.log('🖱️ Date thumb clicked!', thumb);
          });
        });
      });
      
      // デバッグ用：任意のタッチイベントを検出
      container.addEventListener('touchstart', function(e) {
        console.log('🔍 Container touchstart detected!', e.target);
      }, true);
      
      container.addEventListener('click', function(e) {
        console.log('🔍 Container click detected!', e.target, e.target.className);
      }, true);
    }
    
    function addTouchEvents(thumb, slider) {
      console.log('🎯 addTouchEvents called for thumb:', thumb, 'slider:', slider);
      
      let isDragging = false;
      let startX = 0;
      let startLeft = 0;
      let touchId = null;
      let dragType = null; // 'touch' or 'mouse'
      
      // 統合ムーブハンドラー（タッチ・マウス両対応）
      const moveHandler = function(e) {
        if (!isDragging) {
          console.log('👉 Move: not dragging');
          return;
        }
        
        let clientX;
        
        if (dragType === 'touch') {
          // タッチイベントの場合
          let targetTouch = null;
          for (let i = 0; i < e.touches.length; i++) {
            if (e.touches[i].identifier === touchId) {
              targetTouch = e.touches[i];
              break;
            }
          }
          
          if (!targetTouch) {
            console.log('👉 Touch move: target touch not found');
            return;
          }
          clientX = targetTouch.clientX;
        } else {
          // マウスイベントの場合
          clientX = e.clientX;
        }
        
        e.preventDefault();
        
        const sliderRect = slider.getBoundingClientRect();
        const deltaX = clientX - startX;
        const newLeft = startLeft + (deltaX / sliderRect.width) * 100;
        
        // 範囲制限
        const clampedLeft = Math.max(0, Math.min(100, newLeft));
        thumb.style.left = clampedLeft + '%';
        
        console.log(`👉 ${dragType} move:`, {
          deltaX: deltaX.toFixed(2),
          newLeft: newLeft.toFixed(2),
          clampedLeft: clampedLeft.toFixed(2)
        });
        
        // トラックの更新
        updateSliderTrack(slider, thumb);
        
        // 対応する入力フィールドを更新
        updateInputFromThumb(thumb, slider, clampedLeft);
      };
      
      // 統合エンドハンドラー（タッチ・マウス両対応）
      const endHandler = function(e) {
        if (!isDragging) return;
        
        let shouldEnd = false;
        
        if (dragType === 'touch') {
          // タッチの場合：対象のタッチが終了したかチェック
          shouldEnd = true;
          for (let i = 0; i < e.touches.length; i++) {
            if (e.touches[i].identifier === touchId) {
              shouldEnd = false;
              break;
            }
          }
        } else {
          // マウスの場合：常に終了
          shouldEnd = true;
        }
        
        if (shouldEnd) {
          console.log(`🔚 ${dragType} end`);
          const currentDragType = dragType; // dragTypeをクリアする前に保存
          
          isDragging = false;
          touchId = null;
          thumb.style.zIndex = '';
          
          // イベントリスナーを削除
          if (currentDragType === 'touch' || e.type === 'touchend') {
            document.removeEventListener('touchmove', moveHandler);
            document.removeEventListener('touchend', endHandler);
          } else {
            document.removeEventListener('mousemove', moveHandler);
            document.removeEventListener('mouseup', endHandler);
          }
          
          dragType = null; // 最後にクリア
          
          // change イベントを発火して値を確定
          const input = getCorrespondingInput(thumb, slider);
          if (input) {
            input.dispatchEvent(new Event('input', { bubbles: true }));
            input.dispatchEvent(new Event('change', { bubbles: true }));
          }
        }
      };
      
      // タッチ開始
      thumb.addEventListener('touchstart', function(e) {
        console.log('👆 Touch start detected!');
        e.preventDefault();
        
        if (isDragging) {
          console.log('⚠️ Already dragging, ignoring');
          return;
        }
        
        isDragging = true;
        dragType = 'touch';
        const touch = e.touches[0];
        touchId = touch.identifier;
        startX = touch.clientX;
        
        const currentLeft = parseFloat(thumb.style.left) || 0;
        startLeft = currentLeft;
        
        console.log('👆 Touch start:', {
          touchId,
          startX,
          startLeft
        });
        
        thumb.style.zIndex = '1000';
        
        // タッチイベントリスナーを追加
        document.addEventListener('touchmove', moveHandler, { passive: false });
        document.addEventListener('touchend', endHandler, { passive: false });
        
        console.log('👆 Touch event listeners added');
        
      }, { passive: false });
      
      // マウス開始（開発者ツールのエミュレーション対応）
      thumb.addEventListener('mousedown', function(e) {
        console.log('🖱️ Mouse start detected!');
        e.preventDefault();
        
        if (isDragging) {
          console.log('⚠️ Already dragging, ignoring');
          return;
        }
        
        isDragging = true;
        dragType = 'mouse';
        startX = e.clientX;
        
        const currentLeft = parseFloat(thumb.style.left) || 0;
        startLeft = currentLeft;
        
        console.log('🖱️ Mouse start:', {
          startX,
          startLeft
        });
        
        thumb.style.zIndex = '1000';
        
        // マウスイベントリスナーを追加
        document.addEventListener('mousemove', moveHandler);
        document.addEventListener('mouseup', endHandler);
        
        console.log('🖱️ Mouse event listeners added');
        
      });
    }
    
    function updateSliderTrack(slider, movedThumb) {
      // スライダートラックの表示を更新
      const track = slider.querySelector('.range-track, .date-range-track');
      if (!track) return;
      
      const minThumb = slider.querySelector('.range-thumb-min, .date-range-thumb-min');
      const maxThumb = slider.querySelector('.range-thumb-max, .date-range-thumb-max');
      
      if (minThumb && maxThumb) {
        const minPos = parseFloat(minThumb.style.left) || 0;
        const maxPos = parseFloat(maxThumb.style.left) || 100;
        
        track.style.left = minPos + '%';
        track.style.width = (maxPos - minPos) + '%';
      }
    }
    
    function updateInputFromThumb(thumb, slider, percentage) {
      const isDateSlider = slider.classList.contains('date-range-slider');
      const isMinThumb = thumb.classList.contains('range-thumb-min') || thumb.classList.contains('date-range-thumb-min');
      
      console.log('📱 Touch: Updating input from thumb', {
        isDateSlider,
        isMinThumb,
        percentage: percentage.toFixed(2)
      });
      
      if (isDateSlider) {
        const minDate = new Date(slider.dataset.min).getTime();
        const maxDate = new Date(slider.dataset.max).getTime();
        const range = maxDate - minDate;
        const newDate = new Date(minDate + (percentage / 100) * range);
        const dateString = newDate.toISOString().split('T')[0];
        
        const input = slider.parentElement.querySelector(isMinThumb ? '.date-range-min' : '.date-range-max');
        if (input) {
          input.value = dateString;
          console.log('📱 Touch: Date input updated to', dateString);
        }
      } else {
        const min = parseFloat(slider.dataset.min);
        const max = parseFloat(slider.dataset.max);
        const range = max - min;
        const newValue = min + (percentage / 100) * range;
        const roundedValue = Math.round(newValue);
        
        const input = slider.parentElement.querySelector(isMinThumb ? '.range-min' : '.range-max');
        if (input) {
          input.value = roundedValue;
          console.log('📱 Touch: Number input updated to', roundedValue);
        }
      }
    }
    
    function getCorrespondingInput(thumb, slider) {
      const isDateSlider = slider.classList.contains('date-range-slider');
      const isMinThumb = thumb.classList.contains('range-thumb-min') || thumb.classList.contains('date-range-thumb-min');
      
      if (isDateSlider) {
        return slider.parentElement.querySelector(isMinThumb ? '.date-range-min' : '.date-range-max');
      } else {
        return slider.parentElement.querySelector(isMinThumb ? '.range-min' : '.range-max');
      }
    }
    
  } catch (error) {
    console.error('❌ ExceLikeTable の初期化に失敗しました:', error);
    document.getElementById('excelike-table-container').innerHTML = '<div style="color: red; text-align: center; padding: 20px; border: 2px solid #ff4d4f; border-radius: 8px; background: #fff2f0;"><h3>⚠️ テーブルの読み込みに失敗しました</h3><p>以下をお試しください：</p><ul style="text-align: left; display: inline-block;"><li>ページを再読み込み</li><li>ブラウザのキャッシュをクリア</li><li>開発者ツールでエラーを確認</li></ul></div>';
  }
});
</script>
