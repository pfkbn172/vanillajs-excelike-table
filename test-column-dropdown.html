<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Column Dropdown Test - ExceLike Table</title>
    
    <!-- Core styles -->
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/table.css">
    <link rel="stylesheet" href="styles/filters.css">
    <link rel="stylesheet" href="styles/pagination.css">
    <link rel="stylesheet" href="styles/column-settings.css">
    <link rel="stylesheet" href="styles/context-menu.css">
    <link rel="stylesheet" href="styles/theme.css">
    
    <style>
        body {
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        
        .demo-section {
            margin-bottom: 40px;
        }
        
        h2 {
            margin-bottom: 20px;
            color: #333;
        }
        
        #testTable {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .test-controls {
            margin: 20px 0;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
        }
        
        .test-controls button {
            margin-right: 10px;
            padding: 8px 16px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .test-controls button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <h1>Column Dropdown Test</h1>
    
    <div class="demo-section">
        <h2>Test Table with Conditional Formatting</h2>
        
        <div class="test-controls">
            <button onclick="testCreateRule()">Create New Rule</button>
            <button onclick="testManageRules()">Manage Rules</button>
            <button onclick="checkColumnDropdown()">Check Column Dropdown</button>
        </div>
        
        <div id="testTable"></div>
    </div>
    
    <!-- Dependencies -->
    <script src="src/utils/performance-utils.js"></script>
    <script src="src/utils/dom-utils.js"></script>
    <script src="src/utils/date-formatter.js"></script>
    <script src="src/utils/resize-observer-polyfill.js"></script>
    
    <!-- Core modules -->
    <script src="src/i18n.js"></script>
    <script src="src/event-bus.js"></script>
    <script src="src/accessibility.js"></script>
    <script src="src/tooltip.js"></script>
    <script src="src/menu-renderer.js"></script>
    <script src="src/filter-module.js"></script>
    <script src="src/sort-module.js"></script>
    <script src="src/pagination.js"></script>
    <script src="src/virtual-scroll.js"></script>
    <script src="src/column-settings.js"></script>
    <script src="src/context-menu-integration.js"></script>
    <script src="src/export-module.js"></script>
    <script src="src/webworker-support.js"></script>
    
    <!-- Conditional Formatting Plugin -->
    
    <!-- Main table class -->
    <script src="src/ExceLikeTable.js"></script>
    
    <script>
        // Sample data
        const sampleData = [
            { id: 1, name: 'John Smith', department: 'Sales', age: 32, salary: 75000, performance: 85 },
            { id: 2, name: 'Jane Doe', department: 'Marketing', age: 28, salary: 65000, performance: 92 },
            { id: 3, name: 'Bob Johnson', department: 'IT', age: 35, salary: 85000, performance: 78 },
            { id: 4, name: 'Alice Brown', department: 'HR', age: 30, salary: 70000, performance: 88 },
            { id: 5, name: 'Charlie Wilson', department: 'Sales', age: 45, salary: 95000, performance: 95 },
            { id: 6, name: 'Eva Martinez', department: 'IT', age: 26, salary: 60000, performance: 82 },
            { id: 7, name: 'Frank Lee', department: 'Marketing', age: 38, salary: 80000, performance: 90 },
            { id: 8, name: 'Grace Chen', department: 'HR', age: 33, salary: 72000, performance: 86 }
        ];
        
        // Column configuration
        const columns = [
            { key: 'id', title: 'ID', width: 60, sortable: true },
            { key: 'name', title: 'Name', width: 150, sortable: true },
            { key: 'department', title: 'Department', width: 120, sortable: true },
            { key: 'age', title: 'Age', width: 80, sortable: true },
            { key: 'salary', title: 'Salary', width: 100, sortable: true },
            { key: 'performance', title: 'Performance', width: 120, sortable: true }
        ];
        
        let table;
        let cfPlugin;
        
        // Initialize table
        document.addEventListener('DOMContentLoaded', function() {
            // Create table instance
            table = new ExceLikeTable({
                container: document.getElementById('testTable'),
                columns: columns,
                data: sampleData,
                features: ['sorting', 'filtering', 'pagination', 'contextMenu'],
                pagination: {
                    pageSize: 10,
                    showSizeChanger: true
                }
            });
            
            // Initialize table
            table.init();
            
            console.log('Table initialized');
        });
        
        // Test functions - placeholder for future conditional formatting tests
    </script>
</body>
</html>
