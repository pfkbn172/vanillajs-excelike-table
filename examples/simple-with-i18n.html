<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Table with i18n - ExceLike Table</title>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.7/dist/purify.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "dompurify": "https://cdn.jsdelivr.net/npm/dompurify@3.2.7/dist/purify.es.mjs"
    }
  }
  </script>
  <link rel="stylesheet" href="../src/ExceLikeTable.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
    }

    .info {
      background: #e8f5e9;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .table-container {
      height: 500px;
    }
  </style>
</head>
<body>
  <h1>📊 Simple Table with Internationalization (i18n)</h1>

  <div class="info">
    <strong>✨ シンプルな実装 / Simple Implementation:</strong><br>
    言語選択は設定メニュー（⚙️）から利用できます。コードは数行だけ！<br>
    Language selection is available in the settings menu (⚙️). Just a few lines of code!
  </div>

  <div class="table-container" id="my-table"></div>

  <script type="module">
    import ExceLikeTable from '../src/ExceLikeTable.js?v=20251008';

    // サンプルデータ / Sample data
    const data = [
      { id: 1, name: 'John Doe', dept: 'Engineering', salary: 95000 },
      { id: 2, name: 'Jane Smith', dept: 'Marketing', salary: 82000 },
      { id: 3, name: 'Bob Johnson', dept: 'Sales', salary: 78000 },
      { id: 4, name: 'Alice Williams', dept: 'HR', salary: 71000 },
      { id: 5, name: 'Charlie Brown', dept: 'Engineering', salary: 98000 }
    ];

    // カラム定義 / Column definitions
    const columns = [
      { key: 'id', title: 'ID', dataIndex: 'id', width: 80 },
      { key: 'name', title: 'Name', dataIndex: 'name', width: 200 },
      { key: 'dept', title: 'Department', dataIndex: 'dept', width: 150 },
      {
        key: 'salary',
        title: 'Salary',
        dataIndex: 'salary',
        width: 120,
        render: (value) => `$${value.toLocaleString()}`
      }
    ];

    // テーブル初期化 - これだけ！/ Initialize table - That's it!
    const table = new ExceLikeTable('#my-table', {
      data: data,
      columns: columns,
      locale: 'ja', // 初期言語（オプション）/ Initial language (optional)
      pagination: { pageSize: 10 }
    });

    console.log('✅ Table initialized with i18n support');
    console.log('🌍 Available languages:', table.i18n.getAvailableLocales());
    console.log('📝 Open settings menu (⚙️) to change language');
  </script>
</body>
</html>
