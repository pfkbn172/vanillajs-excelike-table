<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExceLikeTable v2.0 - Manual Test (Clean)</title>
  <link rel="stylesheet" href="dist/excelike-table.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 1200px;
      margin: 40px auto;
      padding: 20px;
    }
    h1 {
      color: #333;
      border-bottom: 3px solid #1890ff;
      padding-bottom: 10px;
    }
    .test-section {
      margin: 30px 0;
      padding: 20px;
      background: #f5f5f5;
      border-radius: 8px;
    }
    .info {
      background: #e6f7ff;
      border-left: 4px solid #1890ff;
      padding: 15px;
      margin: 20px 0;
    }
    .warning {
      background: #fff7e6;
      border-left: 4px solid #faad14;
      padding: 15px;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <h1>🧪 ExceLikeTable v2.0.0 - Manual Test (No Auto-Scripts)</h1>

  <div class="warning">
    <strong>⚠️ Clean Test Environment:</strong> Auto-test scripts disabled for manual testing<br>
    <strong>🧹 LocalStorage:</strong> Cleared on page load
  </div>

  <div class="test-section">
    <h2>Test 1: Basic Table (10 rows)</h2>
    <p>All data should be visible initially</p>
    <div id="table1"></div>
  </div>

  <script src="dist/excelike-table.browser.js"></script>
  <script>
    // Clear LocalStorage for clean testing
    localStorage.clear();
    console.log('🧹 LocalStorage cleared');

    // Test data
    const table1Data = [
      { id: 1, name: 'Alice Johnson', age: 28, city: 'New York', joinDate: '2020-03-15', status: 'Active' },
      { id: 2, name: 'Bob Smith', age: 35, city: 'Los Angeles', joinDate: '2019-07-22', status: 'Active' },
      { id: 3, name: 'Carol Davis', age: null, city: '', joinDate: null, status: 'On Leave' },
      { id: 4, name: 'David Brown', age: 42, city: 'Houston', joinDate: '2018-05-30', status: 'Active' },
      { id: 5, name: 'Emma Wilson', age: 26, city: 'Phoenix', joinDate: '2022-09-12', status: 'Active' },
      { id: 6, name: '', age: 39, city: null, joinDate: '2019-11-05', status: '' },
      { id: 7, name: 'Grace Lee', age: 33, city: 'San Antonio', joinDate: '2020-08-18', status: 'Active' },
      { id: 8, name: 'Henry Garcia', age: 45, city: 'San Diego', joinDate: '2017-03-25', status: 'Active' },
      { id: 9, name: 'Ivy Martinez', age: null, city: 'Dallas', joinDate: '', status: 'Active' },
      { id: 10, name: 'Jack Anderson', age: 37, city: 'San Jose', joinDate: '2019-12-20', status: 'On Leave' }
    ];

    window.table1 = new ExceLikeTable('#table1', {
      tableId: 'manual-test-table',
      data: table1Data,
      columns: [
        { key: 'name', title: 'Name', dataIndex: 'name' },
        { key: 'age', title: 'Age', dataIndex: 'age' },
        { key: 'city', title: 'City', dataIndex: 'city' },
        { key: 'joinDate', title: 'Join Date', dataIndex: 'joinDate' },
        { key: 'status', title: 'Status', dataIndex: 'status' }
      ]
    });

    console.log('✅ Table created successfully!');
    console.log('📊 Total rows:', table1Data.length);
  </script>
</body>
</html>
